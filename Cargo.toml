[workspace]
members = [
  "crates/dictionary-pack",
  "crates/dictionary-pack-builder",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/redvelo/elephant-ladder-dictionary"

[workspace.dependencies]
hex = "0.4.3"
ogg = "0.9.2"
opus = "0.4.0"
rubato = "5.0.1"
icu_casemap = "2.3.0"
icu_normalizer = "2.3.0"
rusqlite = { version = "0.37.0", features = ["bundled", "limits"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.7"
sha2 = "0.10.9"
symphonia = { version = "0.6.1", default-features = false, features = ["adpcm", "flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2.0.21"
ureq = "3.4.2"
zstd = "0.14.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
