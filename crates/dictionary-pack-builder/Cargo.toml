[package]
name = "elephant-ladder-dictionary-pack-builder"
description = "Builder and qualification tools for Elephant Ladder dictionary packs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "elephant-dictionary-pack"
path = "src/main.rs"

[features]
default = ["transcode"]
# Building audio collections needs an Opus encoder and a decoder for every source
# format. A machine that only acquires recordings needs neither, and skipping them
# avoids compiling libopus and the decoders on a small host.
transcode = ["dep:ogg", "dep:opus", "dep:rubato", "dep:symphonia"]

[dependencies]
elephant-ladder-dictionary-pack = { path = "../dictionary-pack" }
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
ogg = { workspace = true, optional = true }
opus = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
symphonia = { workspace = true, optional = true }
thiserror.workspace = true
ureq.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile = "3.22.0"

[lints]
workspace = true
