name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      # libopus and SQLite are built from source here, which no sibling repository does.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # An acquisition host builds no encoder and no decoders, so that build has to keep
      # compiling on its own.
      - run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.93.0"
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.93.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets --all-features
