name: Qualify French Wiktionary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-frwiktionary
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_URL: https://kaikki.org/dictionary/downloads/fr/fr-extract.jsonl.gz
      SOURCE_SHA256: 2a73f539f7597d8e1031d055a658d64bbd1ed111ab89983bd0e391d490570e56
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2

      - name: Build qualification tool
        run: cargo build --locked --release --bin elephant-dictionary-pack

      - name: Prepare pinned source and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification-evidence"
          df -h "$RUNNER_TEMP" > "$RUNNER_TEMP/qualification-evidence/disk-before.txt"
          jq --arg revision "$GITHUB_SHA" \
            '.builder_revision = $revision' \
            manifests/frwiktionary-20260901.template.json \
            > "$RUNNER_TEMP/frwiktionary-build.json"
          cp "$RUNNER_TEMP/frwiktionary-build.json" \
            "$RUNNER_TEMP/qualification-evidence/build-manifest.json"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/fr-extract.jsonl.gz" "$SOURCE_URL"
          printf '%s  %s\n' "$SOURCE_SHA256" "$RUNNER_TEMP/fr-extract.jsonl.gz" \
            | sha256sum --check --strict

      - name: Build candidate A
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time --verbose \
            --output="$RUNNER_TEMP/qualification-evidence/build-a.time" \
            bash -o pipefail -c \
            'gzip -dc "$1" | "$2" build --manifest "$3" --input - --output "$4"' \
            _ "$RUNNER_TEMP/fr-extract.jsonl.gz" \
            "$GITHUB_WORKSPACE/target/release/elephant-dictionary-pack" \
            "$RUNNER_TEMP/frwiktionary-build.json" \
            "$RUNNER_TEMP/wiktionary-fr-fr-candidate-a"

      - name: Validate candidate A
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time --verbose \
            --output="$RUNNER_TEMP/qualification-evidence/validate-a.time" \
            "$GITHUB_WORKSPACE/target/release/elephant-dictionary-pack" \
            validate --pack "$RUNNER_TEMP/wiktionary-fr-fr-candidate-a"

      - name: Build candidate B
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time --verbose \
            --output="$RUNNER_TEMP/qualification-evidence/build-b.time" \
            bash -o pipefail -c \
            'gzip -dc "$1" | "$2" build --manifest "$3" --input - --output "$4"' \
            _ "$RUNNER_TEMP/fr-extract.jsonl.gz" \
            "$GITHUB_WORKSPACE/target/release/elephant-dictionary-pack" \
            "$RUNNER_TEMP/frwiktionary-build.json" \
            "$RUNNER_TEMP/wiktionary-fr-fr-candidate-b"

      - name: Compare candidates
        shell: bash
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP/wiktionary-fr-fr-candidate-a"/*; do
            cmp "$file" \
              "$RUNNER_TEMP/wiktionary-fr-fr-candidate-b/$(basename "$file")"
          done
          test "$(find "$RUNNER_TEMP/wiktionary-fr-fr-candidate-a" -maxdepth 1 -type f | wc -l)" \
            -eq "$(find "$RUNNER_TEMP/wiktionary-fr-fr-candidate-b" -maxdepth 1 -type f | wc -l)"
          du -sb "$RUNNER_TEMP/wiktionary-fr-fr-candidate-a" \
            > "$RUNNER_TEMP/qualification-evidence/candidate-size.txt"
          df -h "$RUNNER_TEMP" > "$RUNNER_TEMP/qualification-evidence/disk-after.txt"

      - name: Remove duplicate candidate and source
        run: >-
          rm -rf "$RUNNER_TEMP/wiktionary-fr-fr-candidate-b"
          "$RUNNER_TEMP/fr-extract.jsonl.gz"

      - name: Upload qualified pack
        uses: actions/upload-artifact@v4
        with:
          name: wiktionary-fr-fr-${{ github.sha }}
          path: ${{ runner.temp }}/wiktionary-fr-fr-candidate-a
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiktionary-fr-fr-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/qualification-evidence
          retention-days: 30
          if-no-files-found: warn
